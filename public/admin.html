<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JokStream Admin</title><link rel="stylesheet" href="/styles.css"><style>.admin{max-width:760px;margin:65px auto;padding:28px;background:#111827;border:1px solid var(--line);border-radius:16px}.admin label{display:block;margin:18px 0 7px;color:#cbd5e1}.admin input,.admin textarea{width:100%;padding:12px;background:#080b12;color:white;border:1px solid var(--line);border-radius:8px}.admin textarea{min-height:130px}.admin button{margin-top:20px;padding:12px 22px;background:#7c3aed;color:white;border:0;border-radius:8px;font-weight:800;cursor:pointer}#status{color:var(--cyan)}</style></head><body><header class="topbar"><a class="brand" href="/">JOK<span>STREAM</span></a><a href="/">Back to site</a></header><main class="admin"><p class="eyebrow">CONTROL CENTER</p><h1>Admin settings</h1><p class="muted">Browser authentication uses ADMIN_PASSWORD configured on the server.</p><label for="vast">VAST tag URL (HTTPS)</label><input id="vast" type="url" placeholder="https://example.com/vast.xml"><label for="banner">Banner HTML</label><textarea id="banner" placeholder="Optional banner markup"></textarea><button id="save">Save settings</button><p id="status"></p></main><script>const auth='Basic '+btoa('admin:'+prompt('Admin password'));const status=document.querySelector('#status');fetch('/api/admin/config',{headers:{Authorization:auth}}).then(r=>{if(!r.ok)throw Error('Authentication failed');return r.json()}).then(d=>{document.querySelector('#vast').value=d.vastTagUrl||'';document.querySelector('#banner').value=d.bannerHtml||''}).catch(e=>status.textContent=e.message);document.querySelector('#save').onclick=async()=>{const r=await fetch('/api/admin/config',{method:'POST',headers:{Authorization:auth,'Content-Type':'application/json'},body:JSON.stringify({vastTagUrl:document.querySelector('#vast').value,bannerHtml:document.querySelector('#banner').value})});status.textContent=r.ok?'Saved.':'Unable to save settings.'}</script></body></html>
